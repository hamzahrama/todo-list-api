<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
    h2 { text-align: center; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: white; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; border: 1px solid #ddd; }
    .btn-del { background: #dc3545; padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>My Todo List</h2>
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Tambah tugas baru...">
    <button onclick="addTodo()">Tambah</button>
  </div>
  <ul id="todoList"></ul>

  <script>
    async function loadTodos() {
      const res = await fetch('/api/todos');
      const { data } = await res.json();
      const list = document.getElementById('todoList');
      list.innerHTML = '';
      data.forEach(todo => {
        list.innerHTML += `
          <li>
            <span>${todo.task}</span>
            <button class="btn-del" onclick="deleteTodo(${todo.id})">Hapus</button>
          </li>
        `;
      });
    }

    async function addTodo() {
      const input = document.getElementById('taskInput');
      if (!input.value) return;
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task: input.value })
      });
      input.value = '';
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    loadTodos();
  </script>
</body>
</html>
